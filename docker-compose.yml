version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sme_pilot_postgres
    environment:
      POSTGRES_DB: sme_pilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    command: postgres -c listen_addresses='*'
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sme_network

  redis:
    image: redis:7-alpine
    container_name: sme_pilot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sme_network

volumes:
  postgres_data:
  redis_data:

networks:
  sme_network:
    driver: bridge

